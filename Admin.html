<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - DealKhoj</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Login Section -->
  <section id="login-section" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
      <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Admin Login</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="creatorcreates@gmail.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
          Sign In
        </button>
      </form>
      <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
    </div>
  </section>

  <!-- Admin Dashboard Section -->
  <section id="dashboard-section" class="hidden p-6 max-w-6xl mx-auto">
    <header class="flex justify-between items-center mb-8 border-b pb-4">
      <div>
        <h1 class="text-3xl font-extrabold text-gray-900">Admin Dashboard</h1>
        <p class="text-sm text-gray-500">Manage DealKhoj Products</p>
      </div>
      <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition">
        Logout
      </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Add Product Form -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
        <h3 class="text-xl font-bold mb-4 text-gray-800">Add New Product</h3>
        <form id="product-form" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600">Product Name</label>
            <input type="text" id="prod-name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600">Description</label>
            <textarea id="prod-desc" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600">Category</label>
            <input type="text" id="prod-category" placeholder="e.g. Electronics, Fashion" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-600">Price (₹)</label>
              <input type="number" step="0.01" id="prod-price" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-600">Original Price (₹)</label><input type="number" step="0.01" id="prod-orig-price" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600">Image URL</label>
            <input type="url" id="prod-img" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm" placeholder="https://...">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600">Affiliate Link</label>
            <input type="url" id="prod-aff-url" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm" placeholder="Amazon / Flipkart link">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600">Badge Text (Optional)</label>
            <input type="text" id="prod-badge" placeholder="e.g. 50% OFF, Trending" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
          </div>
          <div class="flex items-center space-x-2 pt-2">
            <input type="checkbox" id="prod-published" checked class="h-4 w-4 text-emerald-600 rounded">
            <label for="prod-published" class="text-sm font-medium text-gray-700">Publish Immediately</label>
          </div>
          <button type="submit" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
            Save Product
          </button>
        </form>
      </div>

      <!-- Products List -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <h3 class="text-xl font-bold mb-4 text-gray-800">Existing Products</h3>
        <div id="products-table-container" class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-50 text-gray-700 uppercase font-semibold text-xs border-b">
              <tr>
                <th class="py-3 px-2">Image</th>
                <th class="py-3 px-2">Name</th>
                <th class="py-3 px-2">Price</th>
                <th class="py-3 px-2">Status</th>
                <th class="py-3 px-2 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="products-tbody" class="divide-y divide-gray-100">
              <!-- Dynamically rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- External Admin Script -->
  <script src="admin.js"></script>
</body>
</html>
