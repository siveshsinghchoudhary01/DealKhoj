<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealKhoj - Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 1. LOGIN SECTION -->
    <div id="login-section" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Login</h2>
            
            <div id="login-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm"></div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Email</label>
                    <input type="email" id="login-email" required placeholder="creatorsiveshofficial@gmail.com"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="Sivesh@123"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" id="login-btn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                    <i class="fas fa-lock"></i> Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- 2. DASHBOARD SECTION -->
    <div id="dashboard-section" class="hidden">
        <!-- Navbar -->
        <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-tags text-emerald-600 text-xl"></i>
                <h1 class="text-xl font-bold text-gray-800">DealKhoj Admin</h1>
            </div>
            <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left: Add / Edit Product Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <h2 id="form-title" class="text-lg font-bold text-gray-800 mb-4">Add New Deal</h2>
                <form id="product-form" class="space-y-4">
                    <input type="hidden" id="product-id">
                    
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Product Title *</label>
                        <input type="text" id="product-title" required placeholder="e.g. Sony WH-1000XM5 Headphones"
                            class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div><div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Deal Price (₹) *</label>
                            <input type="number" id="product-price" required placeholder="19999"
                                class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Original MRP (₹)</label>
                            <input type="number" id="product-original-price" placeholder="29999"
                                class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Category</label>
                            <input type="text" id="product-category" placeholder="Electronics, Fashion..."
                                class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Store / Platform</label>
                            <input type="text" id="product-store" placeholder="Amazon, Flipkart..."
                                class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Image URL *</label>
                        <input type="url" id="product-image" required placeholder="https://example.com/image.jpg"
                            class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Affiliate / Deal Link *</label>
                        <input type="url" id="product-link" required placeholder="https://amzn.to/..."
                            class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="save-btn"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-sm transition">
                            Save Product
                        </button>
                        <button type="button" id="cancel-edit-btn"
                            class="hidden w-1/3 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 rounded-lg text-sm transition">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Right: Product List Table -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">All Deals</h2>
                    <button id="refresh-btn" class="text-sm text-emerald-600 hover:underline flex items-center gap-1"><i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-gray-50 text-gray-600 text-xs uppercase">
                                <th class="py-3 px-4">Product</th>
                                <th class="py-3 px-4">Price</th>
                                <th class="py-3 px-4">Category</th>
                                <th class="py-3 px-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody" class="divide-y divide-gray-200 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-6 text-gray-500">Loading deals...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom Admin Script -->
    <script src="Admin.js"></script>
</body>
</html>
